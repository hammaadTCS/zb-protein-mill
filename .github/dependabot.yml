# Monthly update pull requests for PHP and JavaScript packages (BR-SEC-18).
# Grouped (one pull request per ecosystem for minor and patch updates) to keep CI runs and
# Actions minutes low on GitHub Free. Major updates come one by one and are planned as tasks.
# Security alerts are separate (repository Settings -> Code security -> Dependabot alerts) and
# arrive by e-mail at once. Merge an update pull request only when every check is green.
# GitHub Actions versions (in .github/, a protected folder) are updated by you once a year
# through a [spec-change] pull request.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      composer-minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
