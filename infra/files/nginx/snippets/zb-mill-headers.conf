# Security headers for every response (BR-SEC-14). Installed to /etc/nginx/snippets/.
# The Content-Security-Policy is NOT set here: it needs a new nonce per request, so the
# application sets it (task T1.12).
# nginx rule: a location with its own add_header loses the server-level ones, so every such
# location includes this file again.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
