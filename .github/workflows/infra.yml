name: Infra

# Server scripts and configuration: lint, then the real tests (PostgreSQL, age, rclone, nginx,
# PHP-FPM) on a throwaway runner. Runs only when server files, scripts or workflows change, to
# save Actions minutes (GitHub Free: 2,000 a month for private repositories). Run it by hand any
# time from Actions -> Infra -> Run workflow (for example on the very first push).
on:
  pull_request:
    paths:
      - 'infra/**'
      - 'scripts/**'
      - '.claude/**'
      - '.github/workflows/**'
      - '.env.production.example'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'scripts/**'
      - '.claude/**'
      - '.github/workflows/**'
      - '.env.production.example'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install test tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck age rclone nginx php8.3-fpm php8.3-pgsql postgresql-16
      - name: Lint shell scripts
        run: |
          shellcheck -S warning -x infra/bin/zb-* infra/bin/zb-lib.sh scripts/*.sh
          shellcheck -S warning -x -e SC1091 infra/provision/setup.sh infra/provision/lib.sh infra/provision/steps/*.sh
      - name: Infrastructure tests
        run: sudo bash infra/tests/run-all.sh
