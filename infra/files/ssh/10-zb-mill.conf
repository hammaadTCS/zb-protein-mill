# ZB Mill SSH hardening (BR-SEC-10). Installed to /etc/ssh/sshd_config.d/10-zb-mill.conf.
# The first value sshd reads wins, and this file is read before 50-cloud-init.conf.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers __ADMIN_USER__
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
