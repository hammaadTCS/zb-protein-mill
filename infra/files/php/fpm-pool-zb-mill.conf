; ZB Poultry Protein Mill – PHP-FPM pool.
; Installed to /etc/php/<version>/fpm/pool.d/zb-mill.conf (the default www pool is disabled).
; Sized for 4 GB RAM (O-34): up to 12 workers at about 60–80 MB each.

[zb-mill]
user = zbmill
group = zbmill

listen = /run/php/zb-mill.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 1000
request_terminate_timeout = 60s

; Only the front controller is executed (nginx also enforces this).
security.limit_extensions = .php

catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[error_log] = /var/log/zb-mill/php-fpm-error.log

; Web requests never need to start programs. Artisan on the command line is not affected.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_flag[allow_url_fopen] = off
php_admin_value[upload_max_filesize] = 6M
php_admin_value[post_max_size] = 8M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 30
php_admin_value[max_input_vars] = 2000
