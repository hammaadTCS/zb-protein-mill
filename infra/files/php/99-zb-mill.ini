; ZB Poultry Protein Mill – PHP settings for PHP-FPM.
; Installed to /etc/php/<version>/fpm/conf.d/99-zb-mill.ini.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
date.timezone = UTC
cgi.fix_pathinfo = 0

; OPcache: code only changes on deploy, and every deploy reloads PHP-FPM.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
