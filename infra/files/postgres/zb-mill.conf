# ZB Poultry Protein Mill – PostgreSQL settings.
# Installed to /etc/postgresql/<version>/main/conf.d/zb-mill.conf.
# Sized for the proposed server: 4 GB RAM, SSD (O-34). Re-check if the server size changes.

# Unix socket only. No TCP listener at all (BR-SEC-12).
listen_addresses = ''

max_connections = 50
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB
random_page_cost = 1.1
effective_io_concurrency = 200
wal_compression = on
checkpoint_completion_target = 0.9

timezone = 'UTC'
log_timezone = 'UTC'

# Logging: slow statements and problems only. Statement text can contain names, so
# full statement logging stays off (data-handling.md).
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
log_temp_files = 10MB
log_line_prefix = '%m [%p] %q%u@%d '
