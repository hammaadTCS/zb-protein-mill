# ZB Poultry Protein Mill – PostgreSQL client authentication (BR-SEC-12).
# Installed to /etc/postgresql/<version>/main/pg_hba.conf by infra/provision/steps/30-postgres.sh.
#
# Only local Unix-socket connections are allowed. PostgreSQL does not listen on any
# network address (listen_addresses = '' in conf.d/zb-mill.conf), so there is no
# password to steal and nothing to attack from the network.
# Which database each role may open is decided by GRANT CONNECT (10-roles.sql).
#
# TYPE  DATABASE  USER          METHOD
local   all       postgres      peer
local   all       zb_app        peer map=zbmill
local   all       zb_migrator   peer map=zbmill
local   all       zb_backup     peer map=zbmill
# Everything else is refused.
local   all       all           reject
host    all       all           0.0.0.0/0   reject
host    all       all           ::/0        reject
